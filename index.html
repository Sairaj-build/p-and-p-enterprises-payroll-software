<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P & P Enterprises - Payroll Control Room</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="brand-logo">
          <img src="logo.jpg" alt="P & P Enterprises Logo" class="brand-img">
        </div>
        <div class="brand-text">
          <strong>P & P Enterprises</strong>
          <small>Payroll Control Room</small>
        </div>
      </div>
      
      <nav id="nav">
        <button class="active" data-page="dashboard">
          <span class="nav-icon">▦</span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button data-page="sites">
          <span class="nav-icon">🏢</span>
          <span class="nav-label">Sites</span>
          <span id="siteCountBadge" class="nav-badge">0</span>
        </button>
        <button data-page="employees">
          <span class="nav-icon">👥</span>
          <span class="nav-label">Employees</span>
          <span id="empCountBadge" class="nav-badge">0</span>
        </button>
        <button data-page="attendance">
          <span class="nav-icon">▣</span>
          <span class="nav-label">Attendance & Leave</span>
        </button>
        <button data-page="structures">
          <span class="nav-icon">▧</span>
          <span class="nav-label">Salary Structures</span>
        </button>
        <button data-page="rules">
          <span class="nav-icon">⚙</span>
          <span class="nav-label">Payroll Rules</span>
        </button>
        <button data-page="loans">
          <span class="nav-icon">💳</span>
          <span class="nav-label">Loans & Advances</span>
          <span id="loanCountBadge" class="nav-badge">0</span>
        </button>
        <button data-page="arrears">
          <span class="nav-icon">📑</span>
          <span class="nav-label">Arrears</span>
          <span id="arrearCountBadge" class="nav-badge">0</span>
        </button>
        <button data-page="bonus">
          <span class="nav-icon">🎁</span>
          <span class="nav-label">Bonus Module</span>
        </button>
        <button data-page="payroll">
          <span class="nav-icon">▤</span>
          <span class="nav-label">Payroll Run</span>
        </button>
        <button data-page="payslips">
          <span class="nav-icon">🧾</span>
          <span class="nav-label">Payslips</span>
        </button>
        <button data-page="reports">
          <span class="nav-icon">▥</span>
          <span class="nav-label">Report Center</span>
        </button>
        <button data-page="backup">
          <span class="nav-icon">🛡️</span>
          <span class="nav-label">Auto-Backup & History</span>
        </button>
      </nav>
      
      <div class="side-footer">
        <div class="side-status">
          <div class="live-indicator">
            <span class="pulse-dot"></span>
            <span class="status-title">Auto-Backup Active</span>
          </div>
          <span id="lastSavedTime" class="status-sub">All changes saved locally</span>
        </div>
        <div class="user-pill" id="userPill" style="display: none;">
          <span class="user-avatar">👤</span>
          <span id="currentUserName" class="user-name">Admin</span>
          <button id="logoutBtn" class="icon-btn" title="Sign out">⎋</button>
        </div>
      </div>
    </aside>

    <main>
      <header>
        <div class="header-left">
          <p class="eyebrow">ENTERPRISE PAYROLL SYSTEM</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        
        <div class="header-actions">
          <div id="autoBackupBadge" class="auto-backup-pill" title="All edits are automatically saved and backed up locally">
            <span class="pulse-dot"></span>
            <span id="autoBackupText">Auto-Backup Active</span>
          </div>
          <button id="quickAddEmpBtn" class="primary">+ Add Employee</button>
          <button id="importBtn" class="outline">Import Excel</button>
        </div>
      </header>

      <section id="content" class="content-area"></section>
    </main>
  </div>

  <!-- Interactive Modal Container -->
  <div id="modalContainer" class="modal-overlay" style="display: none;">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <div>
          <p id="modalEyebrow" class="eyebrow">INPUT DIALOG</p>
          <h2 id="modalTitle">Modal Title</h2>
        </div>
        <button id="modalCloseBtn" class="close-btn" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
